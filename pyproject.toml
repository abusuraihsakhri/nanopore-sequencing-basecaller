[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanopore-sequencing-basecaller"
version = "2.0.0"
description = "SquiggleCaller: CTC Connectionist Temporal Classification Basecaller"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.4,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["agents", "nanopore_basecaller"]
py-modules = ["cli", "enrichment", "simulator", "nanopore_basecaller_app"]

[project.scripts]
nanopore-sequencing-basecaller = "cli:main"
squigglecaller-audit = "nanopore_basecaller.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/nanopore-sequencing-basecaller"
Repository = "https://github.com/abusuraihsakhri/nanopore-sequencing-basecaller.git"
