name: Python and browser tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]"
          python -m pip check
      - name: Run Python tests
        env:
          AUDIT_SECRET_KEY: ci-only-test-key-not-for-production
        run: |
          python -m compileall -q agents nanopore_basecaller cli.py enrichment.py simulator.py
          python -m pytest -q
          nanopore-sequencing-basecaller --help
          squigglecaller-audit --help
      - name: JavaScript syntax and decoder regression tests
        run: |
          node --check web/basecaller.js
          node --check web/app.js
          node --test tests/test_basecaller.cjs
